<style>
:root{
  --navy:#091e42;--biru-gelap:#0f3460;--biru:#1d5fd6;--biru-cerah:#3b82f6;--cyan:#0ea5e9;
  --es:#f3f8ff;--es-2:#e6f0ff;--putih:#fff;--garis:#d6e4f7;--teks:#10233e;--redam:#5a7191;
  --sukses-bg:#e7f8ef;--sukses-teks:#0f7a44;--bahaya-bg:#ffe8ee;--bahaya-teks:#be123c;
  --kuning-bg:#fef3c7;--kuning-teks:#b45309;
  --bayangan:0 10px 28px -10px rgba(15,52,96,.12);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 10% 0%,#dcebff 0%,transparent 40%),var(--es);
  color:var(--teks);line-height:1.6;min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}

/* Top Navbar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--garis)}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--biru-gelap),var(--biru-cerah));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand-title{font-weight:800;font-size:14.5px;color:var(--navy);white-space:nowrap}
.brand-sub{font-size:11.5px;color:var(--redam);white-space:nowrap}
.nav-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-link{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--redam);transition:.2s}
.nav-link:hover{background:var(--es-2);color:var(--biru)}
.nav-link[aria-current="page"]{background:linear-gradient(135deg,var(--biru),var(--biru-cerah));color:#fff}

.nav-right{display:flex;align-items:center;gap:8px}
.dropdown{position:relative}
.drop-btn{padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--es-2);color:var(--biru-gelap);border:1px solid var(--garis)}
.drop-menu{position:absolute;right:0;top:calc(100% + 8px);width:230px;background:#fff;border:1px solid var(--garis);border-radius:12px;padding:8px;box-shadow:var(--bayangan);display:none;z-index:60}
.dropdown.open .drop-menu{display:block}
.drop-menu a{display:flex;justify-content:space-between;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600}
.drop-menu a:hover{background:var(--es);color:var(--biru)}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--garis);background:#fff;font-size:18px}
.mobile-drawer{display:none;background:#fff;border-top:1px solid var(--garis);padding:12px 20px}
.mobile-drawer.open{display:block}
.mobile-drawer a{display:block;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:600;margin-bottom:4px}
.mobile-drawer a[aria-current="page"]{background:var(--biru);color:#fff}

/* Layout & Hero */
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 56px}
.hero{background:linear-gradient(125deg,var(--navy) 0%,var(--biru-gelap) 48%,var(--biru) 100%);color:#fff;border-radius:20px;padding:30px clamp(18px,4vw,38px);margin-bottom:24px;box-shadow:0 18px 40px -16px rgba(15,52,96,.42)}
.hero-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:22px;align-items:center}
.hero-chip{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#dbeafe;margin-bottom:12px}
.hero h1{font-size:clamp(22px,3vw,33px);font-weight:800;line-height:1.2;margin-bottom:8px}
.hero p{color:#d0e2ff;font-size:14.5px;margin-bottom:18px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.hero-id{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:18px}
.hero-id small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd;font-weight:700}
.hero-id h2{font-size:17.5px;font-weight:800;margin:4px 0 12px}
.hero-id-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid rgba(255,255,255,.15);color:#dbeafe}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:700;border:1.5px solid transparent;transition:.2s}
.btn-cyan{background:var(--cyan);color:#06213e}
.btn-glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)}
.btn-primary{background:linear-gradient(135deg,var(--biru),var(--biru-cerah));color:#fff}
.btn-sky{background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff}
.btn-outline{background:#fff;color:var(--biru-gelap);border-color:var(--garis)}
.btn-outline:hover{background:var(--es-2)}

.sec-head{margin:26px 0 14px;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px}
.sec-head h2{font-size:19px;font-weight:800;color:var(--navy)}
.sec-head p{font-size:13px;color:var(--redam)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:15px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:16px 18px;box-shadow:var(--bayangan);border-left:4px solid var(--biru)}
.kpi.cyan{border-left-color:var(--cyan)}
.kpi.navy{border-left-color:var(--biru-gelap)}
.kpi.amber{border-left-color:#f59e0b}
.kpi small{display:block;font-size:11.5px;font-weight:700;color:var(--redam);text-transform:uppercase;margin-bottom:5px}
.kpi strong{display:block;font-size:20px;font-weight:800;color:var(--navy);margin-bottom:3px}
.kpi span{font-size:12px;color:var(--redam)}

.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.mod-card{background:#fff;border:1px solid var(--garis);border-radius:var(--radius);padding:20px;box-shadow:var(--bayangan);display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.mod-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sukses-bg);color:var(--sukses-teks);border:1px solid #a7f3d0}
.mod-card h3{font-size:17px;font-weight:800;color:var(--navy);margin:10px 0 6px}
.mod-card p{font-size:13.5px;color:var(--redam)}
.mod-foot{padding-top:12px;border-top:1px solid var(--es-2);display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--biru)}

.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:18px}
.group-card{background:#f8fbff;border:1.5px solid var(--garis);border-radius:14px;padding:15px;cursor:pointer;transition:.2s}
.group-card:hover{border-color:var(--biru);background:#fff;transform:translateY(-2px)}
.group-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;color:var(--navy)}
.group-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;color:var(--redam)}
.group-row strong{color:var(--teks)}
.group-tot{margin-top:8px;padding-top:8px;border-top:1px dashed #bfd4f2;display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--biru)}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.step{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:16px}
.step-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--biru);color:#fff;font-size:12px;font-weight:800;margin-bottom:8px}
.step h4{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:4px}
.step p{font-size:12.5px;color:var(--redam)}

.mod-banner{background:linear-gradient(135deg,#fff 0%,#eaf2ff 100%);border:1px solid var(--garis);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:var(--bayangan)}
.mod-banner h1{font-size:clamp(22px,3vw,28px);font-weight:800;color:var(--navy);margin:6px 0}
.mod-banner p{color:var(--redam);font-size:14px;margin-bottom:16px;max-width:74ch}
.aksi{display:flex;flex-wrap:wrap;gap:10px}

.view-tabs{display:inline-flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid var(--garis);padding:6px;border-radius:12px;margin-bottom:20px}
.vtab{padding:8px 14px;border-radius:9px;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--redam)}
.vtab.active{background:var(--biru);color:#fff}

.charts-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:20px}
.chart-box{position:relative;height:280px;padding:16px}

.panel{background:#fff;border:1px solid var(--garis);border-radius:var(--radius);overflow:hidden;box-shadow:var(--bayangan);margin-bottom:20px}
.panel.hidden{display:none}
.panel-head{padding:14px 18px;background:linear-gradient(90deg,#f8fbff,#eef5ff);border-bottom:1px solid var(--garis);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{font-size:15px;font-weight:800;color:var(--navy)}
.panel-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#dbeafe;color:var(--biru-gelap)}

.sub-tabs{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-bottom:1px solid var(--garis);background:#fafcff}
.stab{padding:7px 14px;border-radius:9px;border:1px solid var(--garis);background:#fff;font-size:13px;font-weight:700;color:var(--redam)}
.stab.active{background:var(--biru);color:#fff;border-color:var(--biru)}

.frame-box{width:100%;background:#fff}
.frame-box iframe{display:block;width:100%;height:100%;border:0}

.table-tools{padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--garis);background:#fcfdff}
.search-input,.filter-select{padding:8px 12px;border-radius:9px;border:1px solid var(--garis);font-size:13px;background:var(--es);color:var(--teks)}
.search-input{min-width:220px}
.tbl-scroll{overflow-x:auto;max-height:460px}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
th,td{padding:10px 13px;border-bottom:1px solid #e6effa;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:#f1f7ff;color:var(--biru-gelap);font-weight:700;font-size:11.5px;text-transform:uppercase;z-index:2}
tbody tr:hover{background:#f8fbff}

.code-pill{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700;background:#e6f0ff;color:var(--biru);border:1px solid #c7ddff;font-family:'JetBrains Mono',monospace}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.green{background:var(--sukses-bg);color:var(--sukses-teks)}
.pill.red{background:var(--bahaya-bg);color:var(--bahaya-teks)}
.pill.blue{background:var(--es-2);color:var(--biru)}
.pill.amber{background:var(--kuning-bg);color:var(--kuning-teks)}

.pieces-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:18px}
.pieces-card{padding:14px;border-radius:12px;background:#f8fbff;border:1px solid var(--garis)}
.track{height:8px;background:#dce8fa;border-radius:999px;overflow:hidden;margin:8px 0}
.fill{height:100%;background:linear-gradient(90deg,var(--biru),var(--cyan))}
.insight{margin:16px 18px 0;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#eff6ff,#e0f2fe);border:1px solid #93c5fd;font-size:13.5px}

/* Modal Angsuran */
.modal-backdrop{position:fixed;inset:0;background:rgba(9,30,66,.58);display:none;place-items:center;z-index:120;padding:18px}
.modal-backdrop.open{display:grid}
.modal{background:#fff;border-radius:18px;max-width:600px;width:100%;padding:22px;box-shadow:0 24px 48px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--garis);margin-bottom:14px}
.angsuran-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.angsuran-item{border:1px solid var(--garis);border-radius:10px;padding:10px;background:#f8fbff;font-size:12px}
.angsuran-item strong{display:block;color:var(--navy);margin-top:3px;font-size:13px}

.footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--garis);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--redam)}

@media(max-width:960px){.hero-grid,.mod-grid,.charts-grid{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.nav-pills,.dropdown{display:none}.burger{display:grid}.steps{grid-template-columns:1fr}.search-input{width:100%}.aksi .btn{width:100%}.angsuran-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function parseCSV(txt){
  return txt.trim().split(/\r?\n/).map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g,"").replace(/""/g,'"')));
}

function loadKas(csv, isLive){
  const rows = parseCSV(csv); if(rows.length < 2) return;
  const h = rows[0].map(x => x.toLowerCase());
  const iTok = h.findIndex(x => x.includes("token kelompok")), iAng = h.findIndex(x => x.includes("token anggota"));
  const iNam = h.findIndex(x => x === "nama" || x.includes("nama")), iJab = h.findIndex(x => x.includes("jabatan"));
  const iTgl = h.findIndex(x => x.includes("tanggal")), iJen = h.findIndex(x => x.includes("jenis"));
  const iJml = h.findIndex(x => x === "jumlah"), iNom = h.findIndex(x => x.includes("nominal"));
  const iKet = h.findIndex(x => x.includes("keterangan")), iBuk = h.findIndex(x => x.includes("bukti"));
  let list = [], m = 0, k = 0, cm = 0, ck = 0;
  for(let i = 1; i < rows.length; i++){
    const r = rows[i]; if(!r || r.length < 4) continue;
    const jenis = (r[iJen] || "").trim(); if(!jenis) continue;
    const nom = parseInt(((r[iNom] || "0")).replace(/[^\d]/g, ""), 10) || 0;
    if(jenis.toLowerCase().includes("masuk")){ m += nom; cm++; } else if(jenis.toLowerCase().includes("keluar")){ k += nom; ck++; }
    list.push({ tok: r[iTok]||"-", ang: r[iAng]||"-", nama: r[iNam]||"-", jab: r[iJab]||"-", tgl: r[iTgl]||"-", jenis, jml: r[iJml]||"1", nom, ket: r[iKet]||"-", bukti: r[iBuk]||"" });
  }
  state.kas = list; state.masuk = m; state.keluar = k; state.cMasuk = cm; state.cKeluar = ck; state.liveKas = isLive;
}

function dimOf(txt, idx, tot){
  const t = (txt || "").toLowerCase();
  if(t.includes("kecepatan") || t.includes("ketepatan")) return "Performance";
  if(t.includes("informasi") || t.includes("saldo") || t.includes("kejelasan")) return "Information";
  if(t.includes("biaya") || t.includes("manfaat") || t.includes("iuran")) return "Economics";
  if(t.includes("transparansi") || t.includes("keamanan")) return "Control & Security";
  if(t.includes("kemudahan") || t.includes("efisiensi")) return "Efficiency";
  if(t.includes("keramahan") || t.includes("pelayanan")) return "Service";
  return DIMS[Math.min(5, Math.floor(idx / Math.max(1, Math.round(tot / 6))))];
}

function katLikert(s){
  if(s >= 4.21) return { l: "Sangat Puas", c: "green" };
  if(s >= 3.41) return { l: "Puas", c: "blue" };
  if(s >= 2.61) return { l: "Cukup Puas", c: "amber" };
  return { l: "Kurang Puas", c: "red" };
}

function loadKepuasanKas(csv){
  const rows = parseCSV(csv); if(rows.length < 2) return;
  const h = rows[0], hl = h.map(x => x.toLowerCase()), iNam = hl.findIndex(x => x.includes("nama"));
  const qIdx = [];
  for(let c = 0; c < h.length; c++){ if(c !== iNam && !hl[c].includes("timestamp") && !isNaN(parseFloat(rows[1][c]))) qIdx.push(c); }
  const qMeta = qIdx.map((col, i) => ({ code: "P"+(i+1), col, text: h[col], dim: dimOf(h[col], i, qIdx.length), avg: 0 }));
  const resp = [];
  for(let i = 1; i < rows.length; i++){
    const r = rows[i]; if(!r || r.length < 3) continue;
    const b = {}; DIMS.forEach(d => b[d] = []); let tot = 0, cnt = 0, sc = [];
    qMeta.forEach(q => { const v = parseFloat(r[q.col]) || 0; sc.push(v); if(v > 0){ b[q.dim].push(v); tot += v; cnt++; } });
    if(!cnt) continue;
    const dims = {}; DIMS.forEach(d => dims[d] = b[d].length ? b[d].reduce((a,c)=>a+c,0)/b[d].length : 0);
    resp.push({ nama: (r[iNam]||("Responden "+i)).trim(), sc, dims, avg: tot/cnt });
  }
  const n = resp.length || 1;
  qMeta.forEach((q, qi) => q.avg = resp.reduce((s, x) => s + (x.sc[qi]||0), 0) / n);
  const meanDims = {};
  DIMS.forEach(d => { const qs = qMeta.filter(q => q.dim === d); meanDims[d] = qs.length ? qs.reduce((s, q) => s + q.avg, 0) / qs.length : 0; });
  state.respKas = resp; state.qMetaKas = qMeta; state.meanDimsKas = meanDims; state.overallKas = resp.reduce((s, x) => s + x.avg, 0) / n;
}

function renderKasTable(){
  const b = $("#kasBody"); if(!b) return;
  const q = ($("#searchKas")?.value||"").toLowerCase(), f = $("#filterKas")?.value||"all";
  const rows = state.kas.filter(x => (f==="all" || x.jenis.toLowerCase()===f.toLowerCase()) && (x.nama+x.tok+x.ket).toLowerCase().includes(q));
  b.innerHTML = rows.length ? rows.map((x,i)=>{
    const m = x.jenis.toLowerCase().includes("masuk");
    return `<tr><td>${i+1}</td><td>${esc(x.tgl)}</td><td><span class="code-pill">${esc(x.tok)}</span></td><td><strong>${esc(x.nama)}</strong><br><small style="color:var(--redam)">${esc(x.jab)}</small></td><td><span class="pill ${m?"green":"red"}">${esc(x.jenis)}</span></td><td class="mono" style="color:${m?"var(--sukses-teks)":"var(--bahaya-teks)"}">${rp(x.nom)}</td><td>${esc(x.ket)}</td><td>${x.bukti?`<a href="${esc(x.bukti)}" target="_blank" class="code-pill">Bukti &#8599;</a>`:"-"}</td></tr>`;
  }).join("") : `<tr><td colspan="8" style="text-align:center;color:var(--redam);padding:20px">Data tidak ditemukan.</td></tr>`;
}

function renderIuranTables(){
  const b = $("#iuranBody"); if(b){
    const q = ($("#searchIuran")?.value||"").toLowerCase(), fk = $("#filterIuranKel")?.value||"ALL", fj = $("#filterIuranJab")?.value||"ALL";
    const rows = getIuranFiltered().filter(d => (fk==="ALL"||d.token===fk) && (fj==="ALL"||d.jabatan===fj) && (d.nama+d.id+d.alamat).toLowerCase().includes(q));
    $("#iuranCountBadge").textContent = `${rows.length} Data`;
    b.innerHTML = rows.length ? rows.map((d,i)=>{const g=grpInfo(d.token);return `<tr><td>${i+1}</td><td><span class="pill blue">${g.icon} ${esc(g.name)}</span></td><td class="mono">${esc(d.id)}</td><td><strong>${esc(d.nama)}</strong></td><td>${esc(d.jabatan)}</td><td>${esc(d.alamat)}</td><td class="mono">${rp(d.tabungan)}</td><td class="mono">${rp(d.iuran)}</td><td class="mono">${rp(d.sukarela)}</td><td>${esc(d.bulan)}</td><td><span class="pill green">&#10003; ${esc(d.status)}</span></td></tr>`;}).join("") : `<tr><td colspan="11" style="text-align:center;padding:20px">Data tidak ditemukan.</td></tr>`;
  }
  const kb = $("#kepIuranBody"); if(kb){
    const q = ($("#searchKepIuran")?.value||"").toLowerCase();
    const rows = DATA_KEP_IURAN.filter(r => r.nama.toLowerCase().includes(q));

function initPageCharts(id){
  if(typeof Chart === "undefined") return;
  clearCharts();
  if(id === "kas-kelompok"){
    const c1 = $("#kasChart"), c2 = $("#piecesKasChart");
    if(c1){
      const g = {}; state.kas.forEach(r=>{ g[r.tok]=g[r.tok]||{m:0,k:0}; r.jenis.toLowerCase().includes("masuk")?g[r.tok].m+=r.nom:g[r.tok].k+=r.nom; });
      const l = Object.keys(g);
      activeCharts.push(new Chart(c1,{type:"bar",data:{labels:l,datasets:[{label:"Kas Masuk",data:l.map(x=>g[x].m),backgroundColor:"#1d5fd6",borderRadius:6},{label:"Kas Keluar",data:l.map(x=>g[x].k),backgroundColor:"#0ea5e9",borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}}));
    }
    if(c2) activeCharts.push(new Chart(c2,{type:"radar",data:{labels:DIMS,datasets:[{label:"Skor",data:DIMS.map(d=>state.meanDimsKas[d]||0),backgroundColor:"rgba(29,95,214,.22)",borderColor:"#1d5fd6",pointBackgroundColor:"#0ea5e9"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:5}}}}));
  }
  if(id === "iuran-kelompok"){
    const data = getIuranFiltered(), grp = {};
    data.forEach(d=>{ if(!grp[d.token]) grp[d.token]={n:grpInfo(d.token).name,t:0,i:0,s:0}; grp[d.token].t+=d.tabungan; grp[d.token].i+=d.iuran; grp[d.token].s+=d.sukarela; });
    const list = Object.values(grp);
    if($("#iuranBarChart")) activeCharts.push(new Chart($("#iuranBarChart"),{type:"bar",data:{labels:list.map(x=>x.n),datasets:[{label:"Tabungan",data:list.map(x=>x.t),backgroundColor:"#1d5fd6",borderRadius:5},{label:"Iuran Wajib",data:list.map(x=>x.i),backgroundColor:"#0ea5e9",borderRadius:5},{label:"Sukarela",data:list.map(x=>x.s),backgroundColor:"#3b82f6",borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}}));
    if($("#iuranDonutChart")) activeCharts.push(new Chart($("#iuranDonutChart"),{type:"doughnut",data:{labels:["Tabungan","Iuran Wajib","Sukarela"],datasets:[{data:[list.reduce((a,b)=>a+b.t,0),list.reduce((a,b)=>a+b.i,0),list.reduce((a,b)=>a+b.s,0)],backgroundColor:["#1d5fd6","#0ea5e9","#60a5fa"]}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom"}}}}));
    if($("#kepuasanIuranChart")){
      const means = SURVEY_IURAN_LABELS.map((_,i)=>Number((DATA_KEP_IURAN.reduce((s,r)=>s+r.scores[i],0)/DATA_KEP_IURAN.length).toFixed(2)));
      activeCharts.push(new Chart($("#kepuasanIuranChart"),{type:"bar",data:{labels:SURVEY_IURAN_LABELS,datasets:[{data:means,backgroundColor:means.map(v=>v>=3.6?"#1d5fd6":v>=3.3?"#0ea5e9":"#93c5fd"),borderRadius:6}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{min:0,max:5}}}}));
    }
  }
  if(id === "simpan-pinjam"){
    const pk = {}, kp = {}; DATA_PINJAMAN.forEach(r=>{ pk[r.kelompok]=(pk[r.kelompok]||0)+r.besar; kp[r.keperluan]=(kp[r.keperluan]||0)+1; });
    if($("#spKelChart")) activeCharts.push(new Chart($("#spKelChart"),{type:"bar",data:{labels:Object.keys(pk),datasets:[{label:"Total Pinjaman",data:Object.values(pk),backgroundColor:["#0f3460","#1d5fd6","#0ea5e9","#3b82f6","#60a5fa","#0284c7"],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}}));
    if($("#spKepChart")) activeCharts.push(new Chart($("#spKepChart"),{type:"doughnut",data:{labels:Object.keys(kp),datasets:[{data:Object.values(kp),backgroundColor:["#0f3460","#1d5fd6","#0ea5e9","#3b82f6","#60a5fa","#93c5fd"]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}}));
    if($("#spPiecesBar")) activeCharts.push(new Chart($("#spPiecesBar"),{type:"bar",data:{labels:DATA_PIECES_PINJAMAN.map(d=>d.dimensi),datasets:[{data:DATA_PIECES_PINJAMAN.map(d=>d.rata),backgroundColor:"#1d5fd6",borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:5}}}}));
    if($("#spPiecesRadar")) activeCharts.push(new Chart($("#spPiecesRadar"),{type:"radar",data:{labels:DATA_PIECES_PINJAMAN.map(d=>d.dimensi),datasets:[{label:"Skor",data:DATA_PIECES_PINJAMAN.map(d=>d.rata),backgroundColor:"rgba(29,95,214,.22)",borderColor:"#1d5fd6",pointBackgroundColor:"#0ea5e9"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:5,ticks:{stepSize:1}}}}}));
  }
}

window.swapSub = (btn, targetId, cls) => {
  document.querySelectorAll("."+cls).forEach(e => e.style.display="none");
  btn.parentElement.querySelectorAll(".stab").forEach(b => b.classList.remove("active"));
  document.getElementById(targetId).style.display="block"; btn.classList.add("active");
};

window.filterIuranGroup = tok => {
  const sel = $("#filterIuranKel"); if(sel){ sel.value = tok; renderIuranTables(); $("#iuranTablePanel")?.scrollIntoView({behavior:"smooth"}); }
};

window.openAngsuran = caseNo => {
  const it = DATA_PINJAMAN.find(x => x.caseNo === caseNo); if(!it) return;
  $("#modalTitle").textContent = `Rincian Angsuran — ${it.nama}`;
  $("#modalSub").textContent = `Case #${it.caseNo} • Kelompok ${it.kelompok} • ${rp(it.besar)} (${it.jangka})`;
  $("#modalBody").innerHTML = `<p style="font-size:13px;color:var(--redam)">Keperluan: <strong style="color:var(--navy)">${esc(it.keperluan)}</strong> • Tgl: <strong>${esc(it.tanggal)}</strong></p><div class="angsuran-grid">${Array.from({length:12},(_,i)=>`<div class="angsuran-item"><span>Angsuran ${i+1}</span><strong>${it.angsuran[i]?rp(it.angsuran[i]):"-"}</strong></div>`).join("")}</div>`;
  $("#angsuranModal").classList.add("open");
};
window.closeModal = () => $("#angsuranModal").classList.remove("open");

window.downloadKasPiecesXls = () => {
  const html = `<html><head><meta charset="UTF-8"></head><body><h3>Analisis PIECES Kas POKLAHSAR</h3><table border="1"><tr><th>Dimensi</th><th>Rata-rata</th><th>%</th></tr>${DIMS.map(d=>`<tr><td>${d}</td><td>${(state.meanDimsKas[d]||0).toFixed(2)}</td><td>${(((state.meanDimsKas[d]||0)/5)*100).toFixed(1)}%</td></tr>`).join("")}</table></body></html>`;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html],{type:"application/vnd.ms-excel"})); a.download = "Analisis_PIECES_Kas_POKLAHSAR.xls"; a.click();
};
window.exportIuranCSV = tipe => {
  const csv = tipe==="iuran"
    ? [["Token","Kelompok","ID","Nama","Jabatan","Alamat","Tabungan","Iuran","Sukarela","Bulan","Status"], ...getIuranFiltered().map(d=>[d.token,grpInfo(d.token).name,d.id,d.nama,d.jabatan,d.alamat,d.tabungan,d.iuran,d.sukarela,d.bulan,d.status])].map(r=>r.join(",")).join("\n")
    : [["Timestamp","Nama",...SURVEY_IURAN_LABELS], ...DATA_KEP_IURAN.map(r=>[r.ts,r.nama,...r.scores])].map(r=>r.join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"})); a.download = tipe==="iuran"?"Rekap_Iuran_POKLAHSAR.csv":"Kepuasan_Iuran_POKLAHSAR.csv"; a.click();
};
window.exportPinjamanCSV = () => {
  const csv = [["Case","Timestamp","Kelompok","Token","Nama","Jabatan","Tanggal","Pinjaman","Tenor","Keperluan"], ...DATA_PINJAMAN.map(r=>[r.caseNo,r.timestamp,r.kelompok,r.tokenAnggota,r.nama,r.jabatan,r.tanggal,r.besar,r.jangka,r.keperluan])].map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"})); a.download = "Rekap_Simpan_Pinjam_POKLAHSAR.csv"; a.click();
};

function render(id){
  const h = CONFIG.halaman.find(x => x.id === id) || CONFIG.halaman[0];
  document.title = `${h.judul} | POKLAHSAR — Albert Clodius Vascal`;
  document.querySelectorAll("[data-id]").forEach(a => a.dataset.id === h.id ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  const body = h.id === "beranda" ? renderBeranda(h) : h.id === "kas-kelompok" ? renderKas(h) : h.id === "iuran-kelompok" ? renderIuran(h) : renderSimpanPinjam(h);
  $("#app").innerHTML = body + `<footer class="footer"><span><strong>${esc(CONFIG.nama)}</strong> (${esc(CONFIG.nim)}) • Bagian POKLAHSAR</span><span>${esc(CONFIG.regulasi)}</span></footer>`;

  document.querySelectorAll(".vtab").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".vtab").forEach(x => x.classList.toggle("active", x===b));
    const m = b.dataset.mode;
    document.querySelectorAll("[data-sec]").forEach(s => s.classList.toggle("hidden", m!=="all" && s.dataset.sec!==m));
  }));

  if(h.id === "kas-kelompok"){ renderKasTable(); $("#searchKas")?.addEventListener("input",renderKasTable); $("#filterKas")?.addEventListener("change",renderKasTable); }
  if(h.id === "iuran-kelompok"){
    renderIuranTables();
    $("#searchIuran")?.addEventListener("input",renderIuranTables); $("#filterIuranKel")?.addEventListener("change",renderIuranTables);
    $("#filterIuranJab")?.addEventListener("change",renderIuranTables); $("#searchKepIuran")?.addEventListener("input",renderIuranTables);
    $("#toggleTestIuran")?.addEventListener("change", e => { state.includeTestIuran = e.target.checked; render("iuran-kelompok"); });
  }
  if(h.id === "simpan-pinjam"){ renderSpTable(); $("#searchPinjam")?.addEventListener("input",renderSpTable); $("#filterSpKel")?.addEventListener("change",renderSpTable); $("#filterSpTenor")?.addEventListener("change",renderSpTable); }

  initPageCharts(h.id);
  $("#mobileDrawer").classList.remove("open");
}

function route(){ render(location.hash.slice(1) || "beranda"); }
$("#dropBtn").addEventListener("click", e => { e.stopPropagation(); $("#webDropdown").classList.toggle("open"); });
document.addEventListener("click", () => $("#webDropdown").classList.remove("open"));
$("#burgerBtn").addEventListener("click", () => $("#mobileDrawer").classList.toggle("open"));
window.addEventListener("hashchange", route);

loadKas(FALLBACK_KAS_CSV, false);
loadKepuasanKas(FALLBACK_KEP_KAS_CSV);
buildNav();
route();

Promise.all([
  fetch(CONFIG.links.kas.sheetCsv, { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => ""),
  fetch(CONFIG.links.kas.sheetKepCsv, { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => "")
]).then(([kTxt, pTxt]) => {
  let ch = false;
  if(kTxt && !kTxt.includes("<html") && kTxt.length > 20){ loadKas(kTxt, true); ch = true; }
  if(pTxt && !pTxt.includes("<html") && pTxt.length > 20){ loadKepuasanKas(pTxt); ch = true; }
  if(ch) route();
});
</script>
</body>
</html>
